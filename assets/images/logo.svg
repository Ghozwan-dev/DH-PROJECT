<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="textArcTop" d="M 50,150 A 100,100 0 0,1 250,150" fill="none"/>
    <path id="textArcBottom" d="M 250,150 A 100,100 0 0,1 50,150" fill="none"/>
  </defs>

  <!-- Background circle -->
  <circle cx="150" cy="150" r="142" fill="#FFFFFF"/>

  <!-- Outer Scalloped Crest (Bintang Segi Medallion Pesantren) -->
  <path d="
    M 150 10 
    Q 163 15 174 24 Q 186 16 199 24 Q 209 18 223 29 Q 231 25 244 38 Q 251 37 262 52 
    Q 267 53 275 70 Q 278 74 283 93 Q 283 98 285 117 Q 288 126 286 142 Q 289 150 286 158 
    Q 288 174 285 183 Q 283 202 278 207 Q 275 226 267 230 Q 262 248 251 248 Q 244 262 231 262 
    Q 223 271 209 282 Q 199 276 186 284 Q 174 276 163 285 Q 150 290 137 285 Q 126 276 114 284 
    Q 101 276 91 282 Q 77 271 69 262 Q 56 262 49 248 Q 38 248 33 230 Q 25 226 22 207 
    Q 17 202 15 183 Q 12 174 14 158 Q 11 150 14 142 Q 12 126 15 117 Q 17 98 22 93 
    Q 25 74 33 70 Q 38 53 49 52 Q 56 37 69 38 Q 77 25 91 29 Q 101 18 114 24 
    Q 126 16 137 24 Z" 
    fill="none" stroke="#0E6838" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Outer Ring -->
  <circle cx="150" cy="150" r="132" fill="none" stroke="#0E6838" stroke-width="2.5"/>
  <!-- Middle Ring -->
  <circle cx="150" cy="150" r="124" fill="none" stroke="#0E6838" stroke-width="1.5"/>
  <!-- Inner Ring -->
  <circle cx="150" cy="150" r="82" fill="none" stroke="#0E6838" stroke-width="2"/>
  <circle cx="150" cy="150" r="76" fill="none" stroke="#0E6838" stroke-width="1"/>

  <!-- Teks Melingkar Atas: PONDOK PESANTREN ISLAM -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="13" font-weight="700" fill="#0E6838" letter-spacing="1.5">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      PONDOK PESANTREN ISLAM
    </textPath>
  </text>

  <!-- Teks Melingkar Bawah: CELLONG ARJASA KANGEAN -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="12" font-weight="700" fill="#0E6838" letter-spacing="1.8">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ★ CELLONG ARJASA KANGEAN ★
    </textPath>
  </text>

  <!-- Center Content: Kaligrafi Darul Hikmah & Kitab Terbuka -->
  <!-- Kaligrafi Darul Hikmah (Arabic Calligraphy Text) -->
  <g transform="translate(150, 108)" fill="#0E6838">
    <!-- دار الحكمة -->
    <path d="M -45,0 Q -38,-15 -25,-12 Q -15,-20 0,-15 Q 15,-20 25,-12 Q 38,-15 45,0 Q 30,-3 15,-5 Q 0,-3 -15,-5 Q -30,-3 -45,0 Z"/>
    <text x="0" y="2" font-family="'Traditional Arabic', 'Scheherazade New', 'Amiri', serif" font-size="21" font-weight="bold" text-anchor="middle" fill="#0E6838">
      دار الحكمة
    </text>
  </g>

  <!-- Ikon Kitab Terbuka (Open Qur'an/Book) -->
  <g transform="translate(150, 142)" stroke="#0E6838" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Lembaran Kiri -->
    <path d="M 0,10 C -12,2 -24,4 -36,0 C -38,12 -36,25 -34,36 C -24,39 -12,37 0,44 Z" fill="#F0FDF4"/>
    <!-- Garis Lembaran Kiri -->
    <path d="M -6,14 C -15,8 -24,9 -32,6"/>
    <path d="M -6,21 C -15,15 -24,16 -32,13"/>
    <path d="M -6,28 C -15,22 -24,23 -31,20"/>

    <!-- Lembaran Kanan -->
    <path d="M 0,10 C 12,2 24,4 36,0 C 38,12 36,25 34,36 C 24,39 12,37 0,44 Z" fill="#F0FDF4"/>
    <!-- Garis Lembaran Kanan -->
    <path d="M 6,14 C 15,8 24,9 32,6"/>
    <path d="M 6,21 C 15,15 24,16 32,13"/>
    <path d="M 6,28 C 15,22 24,23 31,20"/>

    <!-- Rehal / Dudukan Kitab Kayu Silang -->
    <path d="M -22,46 L 22,60" stroke-width="3"/>
    <path d="M 22,46 L -22,60" stroke-width="3"/>
    <circle cx="0" cy="53" r="2.5" fill="#0E6838"/>
  </g>
</svg>
