  <!-- ================= MODERN RESPONSIVE WEB TOP NAVBAR ================= -->
  <header class="app-navbar" id="appNavbar">
    <div class="navbar-left">
      <!-- Brand Logo & Title -->
      <div class="navbar-brand" onclick="navigateToHome(currentLoggedInUser)" title="Pondok Pesantren Islam Darul Hikmah">
        <img src="assets/images/logo.png" alt="Logo Darul Hikmah" class="navbar-logo">
        <div class="navbar-brand-text">
          <span class="navbar-brand-top">Pondok Pesantren Islam</span>
          <span class="navbar-brand-title">Darul Hikmah</span>
          <span class="navbar-brand-sub" style="display:none">Sistem Absensi &amp; Kesiswaan</span>
        </div>
      </div>
    </div>


    <!-- Right Side: Notification Bell + Profile & Role Dropdown Pill -->
    <div class="navbar-right">
      <!-- Bell Notification Button & Popover (Pengingat Guru & Monitor Admin) -->
      <div class="notif-bell-wrap" id="teacherNotifWrap">
        <button type="button" class="notif-bell-btn" id="teacherNotifBellBtn" onclick="toggleTeacherNotifPanel(event)" title="Notifikasi Pengingat Guru" aria-label="Notifikasi Pengingat Guru">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="notif-badge" id="teacherNotifBadge">0</span>
        </button>

        <div class="notif-popover" id="teacherNotifPanel" onclick="event.stopPropagation()">
          <div class="notif-popover-header">
            <div>
              <div class="notif-popover-title">Notifikasi Pengingat Guru</div>
              <div class="notif-popover-subtitle" id="teacherNotifPanelSubtitle">Memuat pengingat...</div>
            </div>
          </div>
          <div class="notif-list" id="teacherNotifList"></div>
        </div>
      </div>

      <div class="role-dropdown-btn" id="roleDropdownBtn" onclick="toggleRoleDropdown(event)" title="Mode: Admin — Pilih Mode Pengguna" aria-label="Pilih Mode Pengguna">
        <div class="role-avatar-circle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
      </div>

      <!-- Role Popover Menu -->
      <div class="role-popover" id="homeRolePopover">
        <div class="popover-header">
          <div class="popover-name" id="popoverUserName">Administrator Pondok</div>
          <div class="popover-email" id="popoverUserEmail">admin@darulhikmah.ponpes.id</div>
        </div>
        <div class="popover-item active" id="popoverItemAdmin" onclick="switchHomeRole('Admin')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Mode: Admin</span>
        </div>
        <div class="popover-item" id="popoverItemGuru" onclick="switchHomeRole('Guru')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>Mode: Guru</span>
        </div>
        <div class="popover-item logout" onclick="logoutFromHome()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Keluar (Logout)</span>
        </div>
      </div>
    </div>
  </header>
