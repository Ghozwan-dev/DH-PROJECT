        <!-- ======================================================== -->
        <!-- HALAMAN 8: FORM TAMBAH & EDIT JADWAL (SESUAI BUTIR D & E) -->
        <!-- ======================================================== -->
        <div class="screen-page" id="pageScheduleForm">
          <!-- Top Sticky App Bar -->
          <div class="sub-app-bar">
            <div class="sub-app-bar-left">
              <button class="btn-icon-back" onclick="backFromScheduleForm()" title="Batal">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <span class="sub-app-bar-title" id="schFormPageTitle">Tambah Jadwal Pelajaran</span>
            </div>
            <div class="sub-app-bar-actions"></div>
          </div>

          <div class="snt-content">
            <!-- Conflict Alert Notice -->
            <div class="sch-conflict-alert" id="schConflictNotice" style="display:none;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <div id="schConflictMsg">Pesan kesalahan konflik jadwal.</div>
            </div>

            <form id="scheduleForm" onsubmit="handleScheduleFormSubmit(event)">
              <!-- Section 1: Hari & Kelas -->
              <div class="snt-section-box">
                <div class="snt-section-title">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                  <span>Waktu & Kelas</span>
                </div>

                <div class="form-group" style="margin-bottom:12px;">
                  <label class="form-label" for="schFormDay">Hari Pelajaran *</label>
                  <div class="input-wrapper">
                    <select id="schFormDay" class="form-select" required>
                      <option value="Senin">Senin</option>
                      <option value="Selasa">Selasa</option>
                      <option value="Rabu">Rabu</option>
                      <option value="Kamis">Kamis</option>
                      <option value="Jumat">Jumat</option>
                      <option value="Sabtu">Sabtu</option>
                      <option value="Ahad">Ahad</option>
                    </select>
                  </div>
                </div>

                <div class="form-group" style="margin-bottom:12px;">
                  <label class="form-label" for="schFormClass">Kelas *</label>
                  <div class="input-wrapper">
                    <select id="schFormClass" class="form-select" required onchange="handleFormClassChange()">
                      <option value="VII A">VII A</option>
                      <option value="VII B">VII B</option>
                      <option value="VIII A">VIII A</option>
                      <option value="VIII B">VIII B</option>
                      <option value="IX A">IX A</option>
                      <option value="IX B">IX B</option>
                      <option value="X A">X A</option>
                      <option value="X B">X B</option>
                      <option value="XI A">XI A</option>
                      <option value="XI B">XI B</option>
                      <option value="XII A">XII A</option>
                      <option value="XII B">XII B</option>
                    </select>
                  </div>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="schFormPeriod">Nomor Jam Pelajaran *</label>
                  <div class="input-wrapper">
                    <select id="schFormPeriod" class="form-select" required>
                      <option value="1">Jam Ke-1</option>
                      <option value="2">Jam Ke-2</option>
                      <option value="3">Jam Ke-3</option>
                      <option value="4">Jam Ke-4</option>
                      <option value="5">Jam Ke-5</option>
                      <option value="6">Jam Ke-6</option>
                      <option value="7">Jam Ke-7</option>
                      <option value="8">Jam Ke-8</option>
                      <option value="9">Jam Ke-9</option>
                      <option value="10">Jam Ke-10</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Section 2: Mapel & Guru -->
              <div class="snt-section-box">
                <div class="snt-section-title">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                  <span>Mata Pelajaran & Guru</span>
                </div>

                <div class="form-group" style="margin-bottom:12px;">
                  <label class="form-label" for="schFormSubject">Mata Pelajaran *</label>
                  <div class="input-wrapper">
                    <select id="schFormSubject" class="form-select" required>
                      <option value="Al-Qur'an Hadits">Al-Qur'an Hadits</option>
                      <option value="Fiqih">Fiqih</option>
                      <option value="Bahasa Arab">Bahasa Arab</option>
                      <option value="Akidah Akhlak">Akidah Akhlak</option>
                      <option value="Sejarah Kebudayaan Islam (SKI)">Sejarah Kebudayaan Islam (SKI)</option>
                      <option value="Nahwu Shorof">Nahwu Shorof</option>
                      <option value="Tahfidz Al-Qur'an">Tahfidz Al-Qur'an</option>
                      <option value="Matematika">Matematika</option>
                      <option value="Bahasa Inggris">Bahasa Inggris</option>
                      <option value="IPA Terpadu">IPA Terpadu</option>
                      <option value="Bahasa Indonesia">Bahasa Indonesia</option>
                    </select>
                  </div>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="schFormTeacher">Guru Pengampu *</label>
                  <div class="input-wrapper">
                    <select id="schFormTeacher" class="form-select" required>
                      <option value="Ustadz Ahmad Fauzi">Ustadz Ahmad Fauzi</option>
                      <option value="Ustadzah Halimah">Ustadzah Halimah</option>
                      <option value="Ustadz Mansyur Hidayat">Ustadz Mansyur Hidayat</option>
                      <option value="Ustadz Zulkifli">Ustadz Zulkifli</option>
                      <option value="Ustadzah Nurul Azizah">Ustadzah Nurul Azizah</option>
                      <option value="Ustadz Abdullah Said">Ustadz Abdullah Said</option>
                      <option value="Ustadz Lukman Hakim">Ustadz Lukman Hakim</option>
                    </select>
                  </div>
                </div>
              </div>

              <!-- Section 3: Waktu Belajar -->
              <div class="snt-section-box">
                <div class="snt-section-title">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  <span>Alokasi Waktu Belajar</span>
                </div>

                <div style="display:flex; gap:10px;">
                  <div class="form-group" style="flex:1; margin-bottom:0;">
                    <label class="form-label" for="schFormStartTime">Jam Mulai *</label>
                    <div class="input-wrapper">
                      <input type="text" id="schFormStartTime" class="form-input" value="07:30" placeholder="07:30" required pattern="^[0-2][0-9]:[0-5][0-9]$">
                    </div>
                  </div>
                  <div class="form-group" style="flex:1; margin-bottom:0;">
                    <label class="form-label" for="schFormEndTime">Jam Selesai *</label>
                    <div class="input-wrapper">
                      <input type="text" id="schFormEndTime" class="form-input" value="08:15" placeholder="08:15" required pattern="^[0-2][0-9]:[0-5][0-9]$">
                    </div>
                  </div>
                </div>
                <div style="font-size:11.5px; color:var(--text-muted); margin-top:6px; font-style:italic;">
                  Format 24 jam (contoh: 07:30, 08:15).
                </div>
              </div>

              <!-- Section 4: Ruangan & Catatan -->
              <div class="snt-section-box">
                <div class="snt-section-title">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                  <span>Informasi Tambahan</span>
                </div>

                <div class="form-group" style="margin-bottom:12px;">
                  <label class="form-label" for="schFormRoom">Ruangan Belajar</label>
                  <div class="input-wrapper">
                    <input type="text" id="schFormRoom" class="form-input" placeholder="Contoh: Ruang Kelas VII A">
                  </div>
                </div>

                <div class="form-group" style="margin-bottom:0;">
                  <label class="form-label" for="schFormNotes">Catatan Khusus (Opsional)</label>
                  <div class="input-wrapper">
                    <input type="text" id="schFormNotes" class="form-input" placeholder="Contoh: Membawa kitab Fathul Qorib">
                  </div>
                </div>
              </div>

              <!-- Buttons -->
              <div style="display:flex; gap:10px; margin-top:14px; margin-bottom:24px;">
                <button type="button" class="btn-primary" style="flex:1; background:#FFFFFF; color:var(--text-main); border:1px solid #CBD5E1;" onclick="backFromScheduleForm()">
                  <span>Batal</span>
                </button>
                <button type="submit" class="btn-primary" style="flex:2;" id="schBtnSubmit">
                  <span>Simpan Jadwal</span>
                </button>
              </div>
            </form>
          </div>
        </div>
